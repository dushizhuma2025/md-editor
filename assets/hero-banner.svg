<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="100%">
  <title>阿一公众号编辑器 - 微信 Markdown 在线排版工具</title>
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="50%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#070A13"/>
    </linearGradient>
    
    <!-- 微信绿渐变 -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    
    <!-- AI渐变 -->
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#D946EF"/>
    </linearGradient>
    
    <!-- 卡片发光阴影效果 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
  </defs>

  <!-- 1. 背景 -->
  <rect width="1200" height="500" rx="16" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2"/>
  
  <!-- 科技感背景圆环/光晕 -->
  <circle cx="950" cy="250" r="220" fill="#07C160" opacity="0.08" filter="url(#softGlow)"/>
  <circle cx="200" cy="350" r="180" fill="#6366F1" opacity="0.08" filter="url(#softGlow)"/>
  
  <!-- 科技网格线 -->
  <path d="M 0,50 L 1200,50 M 0,100 L 1200,100 M 0,150 L 1200,150 M 0,200 L 1200,200 M 0,250 L 1200,250 M 0,300 L 1200,300 M 0,350 L 1200,350 M 0,400 L 1200,400 M 0,450 L 1200,450" stroke="#1E293B" stroke-width="0.5" opacity="0.3"/>
  <path d="M 100,0 L 100,500 M 200,0 L 200,500 M 300,0 L 300,500 M 400,0 L 400,500 M 500,0 L 500,500 M 600,0 L 600,500 M 700,0 L 700,500 M 800,0 L 800,500 M 900,0 L 900,500 M 1000,0 L 1000,500 M 1100,0 L 1100,500" stroke="#1E293B" stroke-width="0.5" opacity="0.3"/>

  <!-- 2. 左侧：品牌信息 -->
  <g transform="translate(80, 0)">
    <!-- 标签 -->
    <rect y="95" width="130" height="28" rx="14" fill="#07C160" fill-opacity="0.15" stroke="#07C160" stroke-width="1"/>
    <text x="65" y="113" fill="#10B981" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">微信公众号排版</text>
    
    <!-- 标题 -->
    <text x="0" y="180" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="1">阿一公众号编辑器</text>
    
    <!-- 副标题/Slogan -->
    <text x="0" y="235" fill="url(#aiGrad)" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">AI 智能辅助创作 · 极速一键渲染</text>
    
    <!-- 描述 -->
    <text x="0" y="280" fill="#9CA3AF" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="400">
      <tspan x="0" dy="0">支持丰富的主题样式与自定义 CSS 样式修改，</tspan>
      <tspan x="0" dy="24">将 Markdown 一键完美转换为微信图文排版。</tspan>
    </text>
    
    <!-- 按钮/链接信息 -->
    <g transform="translate(0, 350)">
      <!-- 按钮1：立即体验 -->
      <a href="https://s18ko1y3xwc4.meoo.zone/" target="_blank">
        <rect x="0" y="0" width="150" height="42" rx="21" fill="url(#greenGrad)" filter="url(#glow)"/>
        <text x="75" y="26" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">🚀 立即体验</text>
      </a>
      
      <!-- 按钮2：阿一AI站 -->
      <a href="https://www.ayi001.xyz/" target="_blank">
        <rect x="170" y="0" width="150" height="42" rx="21" fill="#1E293B" stroke="#4B5563" stroke-width="1.5"/>
        <text x="245" y="26" fill="#E5E7EB" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">🌐 阿一AI站</text>
      </a>
    </g>
  </g>

  <!-- 3. 右侧：模拟编辑器 UI -->
  <g transform="translate(600, 60)" filter="url(#glow)">
    <!-- 模拟浏览器窗口 -->
    <rect width="520" height="380" rx="12" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>
    
    <!-- 标题栏 -->
    <rect width="520" height="36" rx="12" fill="#161B22"/>
    <!-- 圆角裁剪底层 rect -->
    <rect y="20" width="520" height="16" fill="#161B22"/>
    <line x1="0" y1="36" x2="520" y2="36" stroke="#30363D" stroke-width="1"/>
    
    <!-- 浏览器红绿灯按钮 -->
    <circle cx="20" cy="18" r="6" fill="#FF5F56" />
    <circle cx="40" cy="18" r="6" fill="#FFBD2E" />
    <circle cx="60" cy="18" r="6" fill="#27C93F" />
    
    <!-- 地址栏/名称 -->
    <rect x="120" y="7" width="280" height="22" rx="11" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
    <text x="260" y="22" fill="#8B949E" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">s18ko1y3xwc4.meoo.zone</text>
    
    <!-- 编辑器主体：双栏对比 -->
    <!-- 左栏：Markdown 输入 -->
    <rect x="15" y="50" width="225" height="315" rx="8" fill="#161B22" stroke="#21262D" stroke-width="1"/>
    <text x="30" y="75" fill="#8B949E" font-family="monospace" font-size="11">Markdown 源码</text>
    
    <g font-family="monospace" font-size="11" xml:space="preserve">
      <text x="30" y="110" fill="#FF7B72"># 阿一公众号编辑器</text>
      <text x="30" y="135" fill="#79C0FF">**AI 智能排版**</text>
      <text x="30" y="160" fill="#79C0FF">- 微信绿专属定制主题</text>
      <text x="30" y="185" fill="#79C0FF">- 一键复制完美排版</text>
      <text x="30" y="210" fill="#79C0FF">- 多种图床自由选择</text>
      <text x="30" y="245" fill="#8B949E">&gt; 自动即时渲染，支持</text>
      <text x="30" y="265" fill="#8B949E">&gt; 各种复杂数学公式和代码</text>
      <text x="30" y="300" fill="#7EE787">```js</text>
      <text x="30" y="320" fill="#D2A8FF">console.log("Hello AI!");</text>
      <text x="30" y="340" fill="#7EE787">```</text>
    </g>
    
    <!-- 右栏：渲染效果 -->
    <rect x="280" y="50" width="225" height="315" rx="8" fill="#FFFFFF" stroke="#E1E4E8" stroke-width="1"/>
    <rect x="280" y="50" width="225" height="30" rx="8" fill="#F6F8FA"/>
    <rect x="280" y="70" width="225" height="10" fill="#F6F8FA"/>
    <text x="295" y="70" fill="#24292E" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold">微信效果预览</text>
    
    <!-- 复制按钮 -->
    <rect x="425" y="54" width="70" height="22" rx="4" fill="#07C160"/>
    <text x="460" y="69" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">📋 复制</text>
    
    <!-- 渲染出来的微信公众号文章内容 -->
    <g font-family="system-ui, -apple-system, sans-serif">
      <!-- 标题 -->
      <text x="295" y="110" fill="#07C160" font-size="14" font-weight="bold">阿一公众号编辑器</text>
      <!-- 下划线 -->
      <line x1="295" y1="118" x2="410" y2="118" stroke="#07C160" stroke-width="2"/>
      
      <!-- 正文 -->
      <text x="295" y="145" fill="#333333" font-size="11" font-weight="bold">AI 智能排版</text>
      
      <!-- 列表 -->
      <circle cx="300" cy="170" r="2.5" fill="#07C160"/>
      <text x="312" y="174" fill="#555555" font-size="11">微信绿专属定制主题</text>
      
      <circle cx="300" cy="192" r="2.5" fill="#07C160"/>
      <text x="312" y="196" fill="#555555" font-size="11">一键复制完美排版</text>
      
      <circle cx="300" cy="214" r="2.5" fill="#07C160"/>
      <text x="312" y="218" fill="#555555" font-size="11">多种图床自由选择</text>
      
      <!-- 引用框 -->
      <rect x="295" y="235" width="195" height="42" rx="4" fill="#F3F4F6"/>
      <line x1="295" y1="235" x2="295" y2="277" stroke="#07C160" stroke-width="3"/>
      <text x="305" y="251" fill="#666666" font-size="10" font-style="italic">自动即时渲染，支持</text>
      <text x="305" y="267" fill="#666666" font-size="10" font-style="italic">各种复杂数学公式和代码</text>
      
      <!-- 代码块 -->
      <rect x="295" y="290" width="195" height="60" rx="4" fill="#2D3748"/>
      <text x="305" y="312" fill="#E2E8F0" font-family="monospace" font-size="10">console.log("Hello AI!");</text>
      <text x="460" y="340" fill="#A0AEC0" font-size="9" text-anchor="middle">JavaScript</text>
    </g>
    
    <!-- 中间：渐变流光转换通道 -->
    <!-- 两个带有箭头的流光线 -->
    <path d="M 248,150 C 265,150 260,200 277,200" stroke="url(#aiGrad)" stroke-width="3" fill="none" stroke-dasharray="6 3"/>
    <path d="M 248,220 C 265,220 260,270 277,270" stroke="url(#aiGrad)" stroke-width="3" fill="none" stroke-dasharray="6 3"/>
    
    <!-- AI 星芒 -->
    <!-- 星芒1 -->
    <path d="M 262,165 L 265,173 L 273,176 L 265,179 L 262,187 L 259,179 L 251,176 L 259,173 Z" fill="#E5E7EB"/>
    <!-- 星芒2 -->
    <path d="M 262,235 L 264,240 L 269,242 L 264,244 L 262,249 L 260,244 L 255,242 L 260,240 Z" fill="#FCE7F3"/>
  </g>
</svg>
